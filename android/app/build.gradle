plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.codetoday.booktracker"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.codetoday.booktracker"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreFile = file("upload-keystore.jks")
            if (!keystoreFile.exists()) {
                keystoreFile = file("../../upload-keystore.jks")
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file("../upload-keystore.jks")
            }
            if (!keystoreFile.exists()) {
                throw new GradleException("Release keystore upload-keystore.jks not found! Checked: " + keystoreFile.absolutePath)
            }
            println("Building release APK signed with keystore: " + keystoreFile.absolutePath)
            storeFile keystoreFile
            storePassword(System.getenv("KEYSTORE_PASSWORD") ?: "codetoday_booktracker_secure")
            keyAlias(System.getenv("KEY_ALIAS") ?: "booktracker")
            keyPassword(System.getenv("KEY_PASSWORD") ?: "codetoday_booktracker_secure")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
