name: book_tracker
description: "Book Tracker by CodeToday - An offline-first digital library, reading journal, and bookshelf companion."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  image_picker: ^1.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
